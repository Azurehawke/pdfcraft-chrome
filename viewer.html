<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PdfCraft</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f1f1f3; font: 14px system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) { html, body { background: #19191c; color: #ddd; } }
    iframe { border: 0; width: 100%; height: 100%; display: block; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; }
    #status[hidden] { display: none; }
  </style>
  <script src="viewer.js" defer></script>
</head>
<body>
  <div id="status">Loading PdfCraft…</div>
  <iframe id="app" title="PdfCraft" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
</body>
</html>
